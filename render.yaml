services:
  - type: web
    name: aping-warehouse
    runtime: node
    repo: https://github.com/hudp20260916/aping-warehouse.git
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        fromDatabase:
          name: aping-warehouse-db
          property: connectionString

databases:
  - name: aping-warehouse-db
    plan: free
